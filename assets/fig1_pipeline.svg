  <text x="658" y="400" font-size="13" fill="#333333">Greedy modularity maximisation</text>
  <text x="658" y="418" font-size="13" fill="#333333">louvain_to_adjacency helper</text>
  <text x="658" y="444" font-size="11" font-weight="700" fill="#2f6690" letter-spacing="1.1">STATUS &#183; IMPLEMENTED</text>
  <rect x="940" y="350" width="260" height="120" rx="4" fill="#f7f9fa" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="958" y="376" font-size="12" font-weight="700" fill="#444444" letter-spacing="1.3">4b &#183; LEIDEN</text>
  <text x="958" y="400" font-size="13" fill="#444444">Refinement gives connected</text>
  <text x="958" y="418" font-size="13" fill="#444444">communities; leidenalg, igraph</text>
  <text x="958" y="444" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="1.1">STATUS &#183; PLANNED</text>
