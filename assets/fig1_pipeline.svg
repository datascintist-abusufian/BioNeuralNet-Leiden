 </defs>
 <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <text x="40" y="44" font-size="21" font-weight="700" fill="#111111">Fig. 1a | BioNeuralNet-Leiden analysis pipeline</text>
  <text x="40" y="68" font-size="13" fill="#555555">Stage icons are schematic. The stage 7 chart plots measured values. Panels b to g below show the same results at full size.</text>
  <line x1="40" y1="82" x2="1200" y2="82" stroke="#111111" stroke-width="1.3"/>
  <rect x="40" y="100" width="260" height="210" rx="4" fill="#f5f7fa" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="58" y="126" font-size="12" font-weight="700" fill="#2f6690" letter-spacing="1.3">1 &#183; INPUT</text>
  <text x="58" y="148" font-size="14.5" font-weight="700" fill="#111111">KIPAN RNA matrix</text>
  <rect x="58" y="158" width="224" height="76" fill="#ffffff" stroke="#c9d4dc" stroke-width="1"/>
  <rect x="70" y="168" width="120" height="58" fill="#ffffff" stroke="#1b1b1b" stroke-width="1"/>
  <rect x="70" y="168" width="120" height="12" fill="#e3ebf1" stroke="#1b1b1b" stroke-width="1"/>
  <g stroke="#9aa9b4" stroke-width="0.8"><line x1="94" y1="168" x2="94" y2="226"/><line x1="118" y1="168" x2="118" y2="226"/><line x1="142" y1="168" x2="142" y2="226"/><line x1="166" y1="168" x2="166" y2="226"/><line x1="70" y1="192" x2="190" y2="192"/><line x1="70" y1="204" x2="190" y2="204"/><line x1="70" y1="216" x2="190" y2="216"/></g>
  <text x="200" y="182" font-size="9.5" fill="#333333">rows: patients</text>
  <text x="200" y="198" font-size="9.5" fill="#333333">cols: transcripts</text>
  <text x="200" y="214" font-size="9.5" fill="#333333">24.6 MB</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#1b1b1b"><text x="58" y="252">patient,ARAP3_64411,GPRC5C_55890,</text><text x="58" y="266">RASGEF1C_255426,PLAC9_219348, ...</text></g>
  <text x="58" y="290" font-size="11" font-weight="700" fill="#2f6690">bioneuralnet/datasets/kipan/rna.csv</text>
  <line x1="300" y1="205" x2="336" y2="205" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="340" y="100" width="260" height="210" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="358" y="126" font-size="12" font-weight="700" fill="#2f6690" letter-spacing="1.3">2 &#183; PREPROCESSING</text>
  <text x="358" y="148" font-size="14.5" font-weight="700" fill="#111111">Filter and standardise</text>
  <rect x="358" y="158" width="224" height="76" fill="#fbfcfd" stroke="#c9d4dc" stroke-width="1"/>
  <polygon points="376,172 452,172 422,204 422,224 406,224 406,204" fill="#dce7ee" stroke="#1b1b1b" stroke-width="1"/>
  <g stroke="#6b8fa8" stroke-width="1.1"><line x1="382" y1="165" x2="382" y2="172"/><line x1="398" y1="165" x2="398" y2="172"/><line x1="414" y1="165" x2="414" y2="172"/><line x1="430" y1="165" x2="430" y2="172"/><line x1="446" y1="165" x2="446" y2="172"/></g>
  <text x="466" y="184" font-size="9.5" fill="#333333">impute</text>
  <text x="466" y="200" font-size="9.5" fill="#333333">z-score</text>
  <text x="466" y="216" font-size="9.5" fill="#333333">variance cut</text>
  <text x="358" y="256" font-size="13" fill="#333333">Imputation, z-score scaling</text>
  <text x="358" y="274" font-size="13" fill="#333333">and variance filtering</text>
  <text x="358" y="296" font-size="11.5" font-weight="700" fill="#2f6690">see panel b</text>
  <line x1="600" y1="205" x2="636" y2="205" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="640" y="100" width="260" height="210" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
  <text x="658" y="126" font-size="12" font-weight="700" fill="#2f6690" letter-spacing="1.3">3 &#183; NETWORK</text>
  <text x="658" y="148" font-size="14.5" font-weight="700" fill="#111111">Correlation graph</text>
  <rect x="658" y="158" width="224" height="76" fill="#fbfcfd" stroke="#c9d4dc" stroke-width="1"/>
  <g stroke="#6b8fa8" stroke-width="1.1"><line x1="690" y1="178" x2="726" y2="170"/><line x1="690" y1="178" x2="712" y2="202"/><line x1="726" y1="170" x2="760" y2="186"/><line x1="760" y1="186" x2="712" y2="202"/><line x1="712" y1="202" x2="748" y2="214"/><line x1="760" y1="186" x2="748" y2="214"/><line x1="760" y1="186" x2="800" y2="204"/><line x1="748" y1="214" x2="800" y2="204"/><line x1="800" y1="204" x2="826" y2="176"/><line x1="800" y1="204" x2="852" y2="196"/><line x1="826" y1="176" x2="852" y2="196"/><line x1="726" y1="170" x2="826" y2="176"/></g>
  <g fill="#2f6690"><circle cx="690" cy="178" r="4.5"/><circle cx="726" cy="170" r="4.5"/><circle cx="760" cy="186" r="4.5"/><circle cx="712" cy="202" r="4.5"/><circle cx="748" cy="214" r="4.5"/><circle cx="800" cy="204" r="4.5"/><circle cx="826" cy="176" r="4.5"/><circle cx="852" cy="196" r="4.5"/></g>
  <text x="658" y="256" font-size="13" fill="#333333">Weighted adjacency, zero diagonal</text>
  <text x="658" y="274" font-size="13" fill="#333333">KIPAN: 89 nodes, 2346 edges</text>
  <text x="658" y="296" font-size="11.5" font-weight="700" fill="#2f6690">see panel c</text>
