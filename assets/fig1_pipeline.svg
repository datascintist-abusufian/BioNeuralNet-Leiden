  <rect x="74" y="574" width="52" height="44" fill="#ffffff" stroke="#1b1b1b" stroke-width="1"/>
  <g stroke="#9aa9b4" stroke-width="0.8"><line x1="87" y1="574" x2="87" y2="618"/><line x1="100" y1="574" x2="100" y2="618"/><line x1="113" y1="574" x2="113" y2="618"/><line x1="74" y1="585" x2="126" y2="585"/><line x1="74" y1="596" x2="126" y2="596"/><line x1="74" y1="607" x2="126" y2="607"/></g>
  <line x1="134" y1="596" x2="158" y2="596" stroke="#1b1b1b" stroke-width="1.2" marker-end="url(#ahs)"/>
  <rect x="166" y="574" width="14" height="44" fill="#dce7ee" stroke="#1b1b1b" stroke-width="1"/>
  <g stroke="#9aa9b4" stroke-width="0.8"><line x1="166" y1="585" x2="180" y2="585"/><line x1="166" y1="596" x2="180" y2="596"/><line x1="166" y1="607" x2="180" y2="607"/></g>
  <text x="190" y="592" font-size="9.5" fill="#333333">PC1</text>
  <text x="190" y="606" font-size="9.5" fill="#333333">vector</text>
