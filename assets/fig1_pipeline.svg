  <g stroke="#6b8fa8" stroke-width="1.1"><line x1="992" y1="182" x2="1018" y2="174"/><line x1="992" y1="182" x2="1006" y2="204"/><line x1="1018" y1="174" x2="1040" y2="196"/><line x1="1006" y1="204" x2="1040" y2="196"/><line x1="1018" y1="174" x2="1006" y2="204"/><line x1="1100" y1="180" x2="1126" y2="172"/><line x1="1100" y1="180" x2="1118" y2="204"/><line x1="1126" y1="172" x2="1150" y2="192"/><line x1="1118" y1="204" x2="1150" y2="192"/><line x1="1040" y1="196" x2="1100" y2="180"/></g>
  <g fill="#2f6690"><circle cx="992" cy="182" r="4.5"/><circle cx="1018" cy="174" r="4.5"/><circle cx="1006" cy="204" r="4.5"/><circle cx="1040" cy="196" r="4.5"/></g>
  <g fill="#8fb0c6"><circle cx="1100" cy="180" r="4.5"/><circle cx="1126" cy="172" r="4.5"/><circle cx="1118" cy="204" r="4.5"/><circle cx="1150" cy="192" r="4.5"/></g>
  <text x="958" y="256" font-size="13" fill="#333333">Dense subgraphs become the</text>
  <text x="958" y="274" font-size="13" fill="#333333">candidate modules</text>
  <text x="958" y="296" font-size="11.5" font-weight="700" fill="#2f6690">two backends below</text>
  <line x1="1070" y1="310" x2="1070" y2="330" stroke="#1b1b1b" stroke-width="1.4"/>
  <line x1="1070" y1="330" x2="770" y2="330" stroke="#1b1b1b" stroke-width="1.4"/>
  <line x1="770" y1="330" x2="770" y2="348" stroke="#1b1b1b" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="1070" y1="330" x2="1070" y2="348" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ahg)"/>
  <rect x="640" y="350" width="260" height="120" rx="4" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.4"/>
