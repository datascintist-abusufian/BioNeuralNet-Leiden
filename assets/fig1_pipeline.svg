  <g stroke="#1b1b1b" stroke-width="1"><line x1="380" y1="572" x2="380" y2="620"/><line x1="380" y1="620" x2="470" y2="620"/></g>
  <line x1="388" y1="612" x2="462" y2="578" stroke="#2f6690" stroke-width="1.6"/>
  <g fill="#2f6690"><circle cx="396" cy="606" r="2.6"/><circle cx="412" cy="602" r="2.6"/><circle cx="428" cy="594" r="2.6"/><circle cx="444" cy="588" r="2.6"/><circle cx="458" cy="580" r="2.6"/></g>
  <text x="482" y="588" font-size="9.5" fill="#333333">PC1 against</text>
  <text x="482" y="602" font-size="9.5" fill="#333333">phenotype y</text>
  <text x="358" y="654" font-size="13" fill="#333333">Modules with fewer than two</text>
  <text x="358" y="672" font-size="13" fill="#333333">features are skipped</text>
  <text x="358" y="694" font-size="11.5" font-weight="700" fill="#2f6690">see panel e</text>
